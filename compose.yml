# Datastore ports bind to 127.0.0.1. Dropping that prefix would expose them to
# the internet, where the dev-only credentials in env_vars are no protection.
# To reach one from another host, tunnel over SSH.
services:
  mysql:
    image: mysql:8.4
    env_file: env_vars
    ports:
      - 127.0.0.1:3306:3306
    volumes:
      - type: volume
        source: mysql_data
        target: /var/lib/mysql
  mongo:
    image: mongo:7
    env_file: env_vars
    ports:
      - 127.0.0.1:27017:27017
    volumes:
      - type: volume
        source: mongo_data
        target: /data/db
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
  memcache:
    image: memcached
    ports:
      - 127.0.0.1:11211:11211
  meilisearch:
    image: getmeili/meilisearch:v1.8.4
    env_file: env_vars
    ports:
      - 127.0.0.1:7700:7700

volumes:
  mysql_data:
  mongo_data:
